name: Build AZ ZEU V14 CRASH FIX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Build Fixed APK
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/az/zeu/sacco14
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.az.zeu.sacco14'
            compileSdk 34
            defaultConfig {
              applicationId "com.az.zeu.sacco14"
              minSdk 24; targetSdk 34
              versionCode 15; versionName "14.1-FIXED"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget='17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
          }
          EOF
          cat > app/src/main/java/com/az/zeu/sacco14/MainActivity.kt <<'KOT'
          package com.az.zeu.sacco14
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          data class Member(val id:Int, val name:String, val dept:String, var save:Double, var shares:Int, var loan:Double)
          class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContent { FixedApp() }
            }
          }
          @Composable
          fun FixedApp(){
            val Green = Color(0xFF0D4D2A)
            var pin by remember { mutableStateOf("") }
            var inPin by remember { mutableStateOf("") }
            var locked by remember { mutableStateOf(true) }
            var first by remember { mutableStateOf(true) }
            var members by remember { mutableStateOf(listOf(Member(1,"Amina K","Finance",150000.0,10,0.0),Member(2,"Joseph M","Ops",200000.0,15,50000.0))) }
            var sel by remember { mutableStateOf<Member?>(null) }
            if(locked){
              Box(Modifier.fillMaxSize().background(Green), contentAlignment=Alignment.Center){
                Card(Modifier.padding(20.dp), shape=RoundedCornerShape(16.dp)){
                  Column(Modifier.padding(20.dp), horizontalAlignment=Alignment.CenterHorizontally){
                    Text("AZ ZEU SACCO V14.1", fontWeight=FontWeight.Bold, color=Green)
                    Text("CRASH FIXED ✅", color=Color.Green, fontSize=12.sp, fontWeight=FontWeight.Bold)
                    OutlinedTextField(value=inPin, onValueChange={if(it.length<=4) inPin=it.filter{it.isDigit()}}, label={Text("PIN")}, modifier=Modifier.padding(top=8.dp))
                    Button(onClick={if(first){if(inPin.length==4){pin=inPin; first=false; locked=false}} else {if(inPin==pin) locked=false}}, modifier=Modifier.fillMaxWidth().padding(top=8.dp), colors=ButtonDefaults.buttonColors(containerColor=Green)){Text(if(first) "SET PIN" else "UNLOCK")}
                  }
                }
              }
            } else {
              Column(Modifier.fillMaxSize().background(Color(0xFFF5F5F5)).padding(12.dp)){
                Card(colors=CardDefaults.cardColors(containerColor=Green), shape=RoundedCornerShape(12.dp), modifier=Modifier.fillMaxWidth()){ Row(Modifier.padding(12.dp).fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween){Text("AZ ZEU SACCO - WORKING!",color=Color.White,fontWeight=FontWeight.Bold); Text("🔒",modifier=Modifier.clip(CircleShape).background(Color.White).clickable{locked=true}.padding(6.dp))} }
                Spacer(Modifier.height(8.dp))
                if(sel==null){
                  Text("Members - Tap to view", fontWeight=FontWeight.Bold)
                  members.forEach{m-> Card(Modifier.fillMaxWidth().padding(vertical=4.dp).clickable{sel=m}){Row(Modifier.padding(10.dp)){Column(Modifier.weight(1f)){Text(m.name,fontWeight=FontWeight.Bold); Text("Dept:${m.dept} Save:${m.save.toInt()} Shares:${m.shares} Loan:${m.loan.toInt()}",fontSize=10.sp)}; Text("View>",color=Green)}}}
                  Spacer(Modifier.height(8.dp))
                  Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Color(0xFFE8F5E9))){Column(Modifier.padding(10.dp)){Text("Content to put:",fontWeight=FontWeight.Bold); Text("1. Add all staff\n2. +50k savings each month\n3. Buy shares 20k\n4. Give loans max 3x savings\n5. Reports auto",fontSize=11.sp)}}
                } else {
                  val m=sel!!; Card(Modifier.fillMaxWidth()){Row(Modifier.padding(10.dp)){Box(Modifier.clip(CircleShape).background(Color.LightGray).clickable{sel=null}.padding(8.dp)){Text("←")}; Spacer(Modifier.width(8.dp)); Text("${m.name} Details",fontWeight=FontWeight.Bold)}}
                  Spacer(Modifier.height(8.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.spacedBy(6.dp)){
                    Button(onClick={members=members.map{if(it.id==m.id) it.copy(save=it.save+50000) else it}; sel=members.find{it.id==m.id}}, colors=ButtonDefaults.buttonColors(containerColor=Green), modifier=Modifier.weight(1f)){Text("+50k Save",fontSize=9.sp)}
                    Button(onClick={members=members.map{if(it.id==m.id) it.copy(shares=it.shares+1, save=it.save+20000) else it}; sel=members.find{it.id==m.id}}, colors=ButtonDefaults.buttonColors(containerColor=Color(0xFFFFC107)), modifier=Modifier.weight(1f)){Text("+Share 20k",fontSize=9.sp,color=Color.Black)}
                    Button(onClick={members=members.map{if(it.id==m.id) it.copy(loan=it.loan+100000) else it}; sel=members.find{it.id==m.id}}, modifier=Modifier.weight(1f)){Text("+Loan 100k",fontSize=9.sp)}
                  }
                  Spacer(Modifier.height(8.dp))
                  Card(Modifier.fillMaxWidth()){Column(Modifier.padding(10.dp)){Text("Member Statement",fontWeight=FontWeight.Bold); Text("Savings: ${m.save.toInt()} UGX\nShares: ${m.shares} (${m.shares*20000} UGX)\nLoan Balance: ${m.loan.toInt()} UGX\n\nAll transactions visible here!",fontSize=11.sp)}}
                }
              }
            }
          }
          KOT
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:allowBackup="true" android:label="AZ ZEU SACCO">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
      - uses: gradle/gradle-build-action@v3
        with: { gradle-version: 8.5 }
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AZ-ZEU-V14-1-FIXED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
